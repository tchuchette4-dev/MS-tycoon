<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14141c">
<title>Tube Tycoon</title>
<style>
:root{
  --bg:#14141c; --card:#1f1f2b; --card2:#2a2a3a; --txt:#f4f4f8; --mute:#9a9ab0;
  --red:#ff3b4e; --gold:#ffc83d; --green:#3ddc84; --blue:#4da3ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
#app{height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
header{padding:10px 14px 6px;text-align:center;position:relative}
#portalBtn{position:absolute;left:10px;top:8px;width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,#9a7bff,#2a1270);font-size:24px;display:none;box-shadow:0 0 14px #6a3dffaa;padding:0;z-index:3}
#portalBtn:active{transform:scale(.92)}
#worldLbl{position:absolute;left:6px;top:56px;width:54px;text-align:center;font-size:10px;font-weight:800;color:var(--gold);display:none}
body.w2{background:#140b2b}
body.w2 #panel,body.w2 .modes{background:#0d0820}
body.w2 #screen:not(.focus){background:linear-gradient(160deg,#6a3dff,#1d0f4a);box-shadow:0 0 22px #8a6bffaa,inset 0 0 18px #0006}
.rank{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);color:var(--gold)}
.money{font-size:34px;font-weight:800;margin-top:4px;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--mute)}
.sub b{color:var(--txt)}
.badges{display:flex;gap:6px;justify-content:center;margin-top:6px;min-height:22px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#3a1f25;color:var(--red)}
.badge.ad{background:#1f3a2a;color:var(--green)}
#tapzone{flex:0 0 auto;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px 14px 10px}
#pc{display:flex;flex-direction:column;align-items:center}
#monitor{position:relative;width:min(66vw,260px,28vh);aspect-ratio:16/10;background:linear-gradient(#34344a,#22222f);border-radius:14px;padding:8px;box-shadow:0 8px 24px #0008,inset 0 1px 0 #ffffff22}
#screen{width:100%;height:100%;border-radius:8px;background:linear-gradient(160deg,#1b5c9a,#0d2b4d);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;box-shadow:0 0 22px #3da0ff55,inset 0 0 18px #0006;transition:transform .06s,box-shadow .2s;cursor:pointer}
#screen:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ffffff1c,transparent 40%);pointer-events:none}
#screen.p{transform:scale(.97);box-shadow:0 0 34px #6cc0ffaa,inset 0 0 18px #0006}
#screen.focus{background:linear-gradient(160deg,#a8321f,#4a1210);box-shadow:0 0 26px #ff5a3daa,inset 0 0 18px #0006}
.scrIc{font-size:42px;line-height:1}
.scrTx{font-size:11.5px;color:#d6e6ff;margin-top:6px;padding:0 8px}
#scrPomo{display:none;width:100%;padding:0 10px}
#screen.focus #scrPomo{display:block}#screen.focus #scrIdle{display:none}
#pTime{font-size:clamp(28px,9vw,40px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.pbar{height:7px;border-radius:9px;background:#0005;overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23d,#ff7a3d)}
#stand{width:34px;height:12px;background:#2a2a38}
#base{width:96px;height:7px;border-radius:5px;background:#34344a}
#pomoRow{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:min(92vw,360px)}
#pDur{display:flex;gap:4px}
#pDur button{flex:1}
#pDur button{border:none;border-radius:9px;padding:6px 2px;background:var(--card);color:var(--mute);font-weight:700;font-size:12px}
#pDur button.on{background:var(--card2);color:var(--gold);outline:2px solid var(--gold)}
#pDur button[disabled]{opacity:.4}
#pBtn{flex:none;border:none;border-radius:12px;padding:10px 8px;background:linear-gradient(#ff6a3d,#d9381e);color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 14px #ff5a3d55}
#pBtn.stop{background:var(--card2);color:var(--mute);box-shadow:none}
.float{position:absolute;pointer-events:none;font-weight:800;color:var(--gold);text-shadow:0 2px 6px #000a;animation:fl .9s ease-out forwards;z-index:5}
@keyframes fl{to{transform:translateY(-70px);opacity:0}}
#buzz{position:absolute;z-index:6;border:none;border-radius:50%;width:64px;height:64px;font-size:30px;background:radial-gradient(circle,#ffe07a,#ff9a1f);box-shadow:0 0 24px #ffb02e;animation:pulse .7s infinite alternate;display:none}
@keyframes pulse{to{transform:scale(1.18)}}
#panel{flex:1;overflow-y:auto;padding:8px 12px 12px;background:#101017;border-radius:18px 18px 0 0;-webkit-overflow-scrolling:touch}
.modes{display:flex;gap:6px;margin-bottom:8px;position:sticky;top:-8px;background:#101017;padding:8px 0 4px;z-index:2}
.modes button{flex:1;padding:7px 0;border:none;border-radius:10px;background:var(--card);color:var(--mute);font-weight:700;font-size:13px}
.modes button.on{background:var(--blue);color:#fff}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:10px;margin-bottom:8px;border:2px solid transparent}
.item .ic{font-size:30px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--card2);border-radius:12px;flex:0 0 auto}
.item .in{flex:1;min-width:0}
.item .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ds{font-size:11.5px;color:var(--mute);margin-top:2px}
.item .buy{flex:0 0 auto;min-width:86px;padding:8px 6px;border:none;border-radius:10px;background:var(--green);color:#06210f;font-weight:800;font-size:12.5px;line-height:1.2}
.item .buy[disabled]{background:var(--card2);color:var(--mute)}
.item.locked{opacity:.4}
.item.big{border-color:var(--gold);background:linear-gradient(135deg,#2c2416,#1f1f2b)}
.item.big.own{box-shadow:0 0 14px #ffc83d44}
.item .ic.logo{width:62px;height:62px;padding:0;background:#0b0b10;border-radius:16px;overflow:hidden}
.item .ic.logo img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.item .by{font-size:11px;color:var(--gold);margin-top:3px;font-weight:700}
#pDur button small{display:block;font-size:9.5px;font-weight:600;margin-top:1px;color:var(--green)}
#pDur button small.pay{color:#8ad0ff}
.badge.gem{background:#12304a;color:#8ad0ff;cursor:pointer}
.pay2{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.pay2 .buy{min-width:88px;padding:6px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:2px solid var(--rc,#555);border-radius:14px;padding:10px 8px;text-align:center;position:relative}
.card .ce{font-size:34px;line-height:1.1;height:42px;display:flex;align-items:center;justify-content:center}
.cimg{max-height:100%;max-width:100%;object-fit:contain;display:block}.card .cn{font-weight:800;font-size:13px;margin-top:3px}
.card .cr{font-size:10px;font-weight:800;color:var(--rc);text-transform:uppercase;letter-spacing:.6px}
.card .cl{font-size:11.5px;color:var(--mute);margin-top:3px}.card .cb{font-size:12px;color:var(--green);font-weight:700;margin-top:2px}
.card.off{opacity:.35;filter:grayscale(1)}
.card.r0{--rc:#9a9ab0}.card.r1{--rc:#4da3ff}.card.r2{--rc:#b46bff}.card.r3{--rc:#ffc83d;box-shadow:0 0 16px #ffc83d66}
.reveal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.reveal .card{animation:pop .5s both;padding:8px 4px}
.reveal .card .cn{font-size:11px}.reveal .card .ce{font-size:28px;height:34px}
.tag{position:absolute;top:-8px;right:-4px;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px}
@keyframes pop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.item .ic.logo .emo{font-size:34px;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.modes.ns{position:static;padding-top:0}
#w2tap{touch-action:manipulation;margin-bottom:8px}
#scrDeco{position:absolute;left:8px;top:6px;display:flex;gap:6px;pointer-events:none;z-index:2}
#scrDeco span{font-size:22px;display:none;filter:drop-shadow(0 2px 3px #000a)}
.sect{font-size:12px;color:var(--mute);margin:10px 2px 6px;text-transform:uppercase;letter-spacing:.8px}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:15px;background:var(--blue);color:#fff;margin-top:6px}
.btn.gold{background:var(--gold);color:#3a2a00}.btn.red{background:var(--red)}.btn.grey{background:var(--card2);color:var(--mute)}
.btn[disabled]{opacity:.45}
.box{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;font-size:13.5px;line-height:1.45}
.box h3{margin:0 0 4px;font-size:15px}
.ach{opacity:.4}.ach.ok{opacity:1;border-color:var(--gold)}
nav{display:flex;background:#0b0b10;border-top:1px solid #222}
nav button{flex:1;min-width:0;padding:8px 0 7px;border:none;background:none;color:var(--mute);font-size:9.5px;font-weight:700}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--gold)}
nav button .dot{display:none;color:var(--red)}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%) translateY(-120px);background:#222a;backdrop-filter:blur(8px);border:1px solid var(--gold);padding:10px 16px;border-radius:14px;font-weight:700;font-size:13px;transition:transform .35s;z-index:50;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
#modal.show{display:flex}
#modal .m{background:var(--card);border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center}
#modal h2{margin:0 0 8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="portalBtn" aria-label="Changer de monde">🌀</button><div id="worldLbl">Monde 1</div>
    <span class="rank" id="rank">Débutant</span>
    <div class="money" id="money">0 €</div>
    <div class="sub"><b id="ips">0</b> <span id="unit">€/s</span> · <b id="subs">0</b> abonnés · <b id="vids">0</b> vidéos</div>
    <div class="badges" id="badges"></div>
  </header>
  <div id="tapzone">
    <div id="pc">
      <div id="monitor"><div id="screen" role="button" aria-label="Travailler sur l'ordinateur"><div id="scrDeco"><span id="talmud">📖</span><span id="hamza">📹</span></div>
        <div id="scrIdle"><div class="scrIc">🎬</div><div class="scrTx">Touche l'écran pour tourner une vidéo !</div></div>
        <div id="scrPomo"><div id="pTime">25:00</div><div class="pbar"><i id="pFill"></i></div><div class="scrTx">🍅 Concentration · revenus ×2</div></div>
      </div></div>
      <div id="stand"></div><div id="base"></div>
    </div>
    <div id="pomoRow"><div id="pDur"></div><button id="pBtn">🍅 Pomodoro</button></div>
    <button id="buzz" aria-label="Buzz">🔥</button>
  </div>
  <div id="panel"></div>
  <nav id="nav">
    <button data-t="gear" class="on"><span>🎥</span>Matériel</button>
    <button data-t="up"><span>⚡</span>Boosts</button>
    <button data-t="owned"><span>✅</span>Acquis</button>
    <button data-t="prestige"><span>📺</span>Chaîne 2</button>
    <button data-t="ach"><span>🏆</span>Succès</button>
    <button data-t="shop"><span>💎</span>Boutique</button>
    <button data-t="opt"><span>⚙️</span>Options</button>
  </nav>
</div>
<div id="toast"></div>
<div id="modal"><div class="m" id="modalBox"></div></div>

const SUF = ["","K","M","B","T","Qa","Qi","Sx","Sp","Oc","No","Dc"]; // B = milliard (1e9), T = 1e12, Qa = 1e15, Qi = 1e18…
function fmt(n){
  if(n<0) return "-"+fmt(-n);
  if(!isFinite(n)) return "∞";
  if(n < 1000) return (n<10 && n%1) ? n.toFixed(1).replace(".",",") : Math.floor(n).toString();
  const e = Math.floor(Math.log10(n)/3);
  if(e < SUF.length){
    const v = n/Math.pow(1000,e);
    return v.toFixed(v<10?2:v<100?1:0).replace(".",",")+" "+SUF[e];
  }
  return n.toExponential(2).replace(".",",").replace("e+","e");
}
const eur = n => fmt(n)+" €";

/* ============ CALCULS ============ */
const gMap = Object.fromEntries(GENS.map(g=>[g.id,g]));
function milestone(n){ let m=1; for(const t of [25,50,100,200,300,400]) if(n>=t) m*=2; return m; }
function genCost(g,n=1,owned=S.owned[g.id]||0){
  const base = g.c*Math.pow(GROWTH,owned);
  return base*(Math.pow(GROWTH,n)-1)/(GROWTH-1);
}
function maxAffordable(g){
  if(S.money<=0) return 0;
  const owned=S.owned[g.id]||0, base=g.c*Math.pow(GROWTH,owned);
  const n=Math.floor(Math.log(S.money*(GROWTH-1)/base+1)/Math.log(GROWTH));
  return Math.max(0,n);
}
function upMult(type,g){
  let m=1;
  for(const u of UPS) if(S.ups[u.id] && (u.t===type || (u.t==="both" && (type==="click"||type==="glob"))) && (type!=="gen"||u.g===g)) m*=u.v;
  return m;
}
function achMult(){ return 1 + 0.02*Object.keys(S.ach).length; }
function subMult(){ return 1 + S.subs*0.00005; }
function fameMult(){ return 1 + S.fame*0.05; }
function buzzMult(){ return Date.now()<S.buzzUntil ? 7 : 1; }
function adMult(){ return Date.now()<S.adUntil ? 2 : 1; }
function pomoMult(){ return (S.pomo && Date.now()<S.pomo.end) ? 2 : 1; }
function globalMult(){ return cardMult("glob")*pomoMult()* subMult()*fameMult()*achMult()*upMult("glob")*buzzMult()*adMult(); }
function baseIps(){
  let t=0;
  for(const g of GENS){ const n=S.owned[g.id]||0; if(n) t+=n*g.i*milestone(n)*upMult("gen",g.id); }
  return t;
}
function ips(){ return baseIps()*globalMult(); }
function clickValue(){

function beep(freq=520,dur=.06,vol=.05){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type="triangle"; o.frequency.value=freq; g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

const mmss=ms=>{ms=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(ms/60)).padStart(2,"0")+":"+String(ms%60).padStart(2,"0");};

$("portalBtn").addEventListener("click",()=>switchWorld());
function renderW2(t){
  const top=`<div class="box"><h3>🪙 <span data-r="hc"></span></h3><span class="sub" data-r="hcips"></span></div>`;
  if(t==="gear") return top+modesBar()+W2_GENS.map((g,i)=>genVisible2(i)?genRow2(g):"").join("");
  const nOwn=CARDS.filter(c=>cardLvl(c.id)).length;
  const bar=`<div class="modes ns">${[["story","Histoire"],["chests","Coffres"],["cards","Cartes "+nOwn+"/"+CARDS.length]].map(([v,l])=>`<button data-wv="${v}" class="${w2View===v?"on":""}">${l}</button>`).join("")}</div>`;
  if(w2View==="chests") return bar+top+chestsHtml();
  if(w2View==="cards") return bar+top+collectionHtml();
  return bar+top+`<div class="sect">Histoire</div>`+STORY.filter(storyVisible).map(u=>storyOwned(u)
    ?`<div class="item big own"><div class="ic logo">${u.logo}</div><div class="in"><div class="nm">${u.n}</div><div class="ds">✅ Acquis · ${u.d}</div></div>${u.sound?`<button class="buy" data-snd="1">▶️ Rejouer</button>`:""}</div>`
    :`<div class="item big" data-s="${u.id}"><div class="ic logo">${u.logo}</div><div class="in"><div class="nm">${u.n}</div><div class="ds">${u.d}</div></div><button class="buy" data-r="buy">${hc(u.c)}</button></div>`).join("");
}
function updateW2(){
  const q=s=>panel.querySelector(s);
  const h=q('[data-r="hc"]');
  if(h){ h.textContent=hc(S.w2.coins); h.style.color=S.w2.coins<0?"var(--red)":""; q('[data-r="hcips"]').textContent=fmt(ips2())+" HC/s"+(w2frozen()?" · 💸 compte bloqué":""); }
  if(tab==="gear"){
    let should=0; W2_GENS.forEach((g,i)=>{ if(genVisible2(i)) should++; });
    if(should!==panel.querySelectorAll("[data-g2]").length){ renderTab(true); return; }
    panel.querySelectorAll("[data-g2]").forEach(el=>{
      const g=W2_GENS.find(x=>x.id===el.dataset.g2), own=S.w2.owned[g.id]||0;
      const n=buyMode===-1?Math.max(1,maxAff2(g)):buyMode, cost=genCost(g,n,own), mm=milestone(own);
      el.querySelector('[data-r="own"]').textContent="× "+own;
      el.querySelector('[data-r="ds"]').textContent="+"+fmt(g.i*mm*w2Big()*cardMult("glob")*pomoMult())+" HC/s chacun"+(mm>1?"  (×"+mm+")":"");
      const b=el.querySelector('[data-r="buy"]'); b.innerHTML=(buyMode===-1?"Max ("+n+")":"×"+n)+"<br>"+hc(cost); b.disabled=S.w2.coins<cost||w2frozen();
    });
  } else if(w2View==="story"){
    panel.querySelectorAll("[data-s]").forEach(el=>{ const u=STORY.find(x=>x.id===el.dataset.s); el.querySelector("button").disabled=S.w2.coins<u.c||w2frozen(); });
  } else if(w2View==="chests"){
    panel.querySelectorAll("[data-chest]").forEach(el=>{
      const c=CHESTS[el.dataset.chest];
      el.querySelector('[data-pay="gems"]').disabled=S.gems<c.gems;
      el.querySelector('[data-pay="hc"]').disabled=S.w2.coins<c.hc;
    });
  }
}

/* ============ BOUCLE ============ */
function header(){
  $("talmud").style.display=(S.world===2&&S.w2.ups.big_talmud)?"block":"none";
  $("hamza").style.display=(S.world===2&&S.w2.ups.big_hamza)?"block":"none";
  const cur=S.world===2?S.w2.coins:S.money;
  $("money").textContent=S.world===2?hc(cur):eur(cur); $("money").style.color=cur<0?"var(--red)":"";
  $("ips").textContent=fmt(S.world===2?ips2():ips());
  $("subs").textContent=fmt(Math.floor(S.subs));
  $("vids").textContent=fmt(S.videos);
  let r=RANKS[0][1]; for(const [t,n] of RANKS) if(S.subs>=t) r=n;
  $("rank").textContent=r;
  const now=Date.now(); let b="";
  if(now<S.buzzUntil) b+=`<span class="badge">🔥 ×7 · ${Math.ceil((S.buzzUntil-now)/1000)}s</span>`;
  if(now<S.adUntil) b+=`<span class="badge ad">📺 ×2 · ${Math.ceil((S.adUntil-now)/1000)}s</span>`;
  if(S.w2.on){
    if(w2frozen()) b+=`<span class="badge">💸 Compte bloqué · ${Math.ceil((S.w2.debtUntil-now)/1000)}s</span>`;
    else if(S.w2.coins<0) b+=`<span class="badge">📉 En dette</span>`;
    b+=S.world===2
      ?`<span class="badge" style="background:#1f2b1f;color:var(--green);cursor:pointer" onclick="switchWorld(1)">💶 ${fmt(S.money)} €</span>`
      :`<span class="badge" style="background:#2a2410;color:var(--gold);cursor:pointer" onclick="switchWorld(2)">🪙 ${fmt(S.w2.coins)} HC</span>`;
  }
  b=`<span class="badge gem" onclick="goTab('shop')">💎 ${S.gems}</span>`+b;
  if(S.pomo) b+=`<span class="badge" style="background:#3a2218;color:#ff9a5a">🍅 ×2 · ${mmss(S.pomo.end-now)}</span>`;
  if(S.fame>0) b+=`<span class="badge" style="background:#2a2a3a;color:#4da3ff">📺 Célébrité ${S.fame}</span>`;
  if($("badges").innerHTML!==b) $("badges").innerHTML=b;
}
function checkAch(){
  for(const a of ACHS) if(!S.ach[a.id] && a.f(S)){ S.ach[a.id]=1; toast("🏆 Succès : "+a.n); beep(1100,.2,.07); if(tab==="ach") renderTab(true); }
}
let prev=performance.now(), acc=0, slow=0;
function frame(t){
  const dt=Math.min(0.25,(t-prev)/1000); prev=t;
  const p=ips(); earn(p*dt);
  if(S.w2.on) earn2(ips2()*dt);
  S.subs += 0.2*Math.pow(Math.max(p,0),0.6)*dt*cardMult("subs");
  acc+=dt; slow+=dt;
  if(S.pomo && Date.now()>=S.pomo.end) finishPomo();
  if(acc>=0.2){ acc=0; header(); updateDynamic(); updatePomoClock(); if(todayKey()!==lastDay){ lastDay=todayKey(); renderPomoUI(); } }
  if(slow>=1){ slow=0; checkAch(); }
  requestAnimationFrame(frame);
}
setInterval(save,10000);
document.addEventListener("visibilitychange",()=>{ if(document.hidden) save(); else offline(); });
window.addEventListener("pagehide",save);

/* ============ HORS-LIGNE ============ */
function offline(){
  const sec=Math.min(OFFLINE_CAP,(Date.now()-S.last)/1000);
  if(sec<30) return;
  const base=baseIps()*subMult()*fameMult()*achMult()*upMult("glob")*cardMult("glob")*cardMult("off");
  const gain=base*sec;
  let hcGain=0; if(S.w2.on){ hcGain=ips2()*sec*cardMult("off"); S.w2.coins+=hcGain; S.w2.total+=hcGain; }
  if(gain<1 && hcGain<1){ S.last=Date.now(); return; }
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60);
  S.last=Date.now();
  showModal(`<h2>👋 Content de te revoir !</h2><p>Pendant ton absence (${h?h+" h ":""}${m} min), tes vidéos ont rapporté</p>
  <div class="money" style="color:var(--gold)">${eur(gain)}</div>${hcGain>0?`<p class="sub">+ ${hc(hcGain)} dans l'autre monde</p>`:""}
  <button class="btn" onclick="collect(${gain},1)">Récupérer</button>
  <button class="btn gold" onclick="collect(${gain},2)">📺 Récupérer ×2 (pub)</button>`);
}
window.collect=function(g,mult){
  if(mult===2){ window.TT_showRewardedAd(()=>{ earn(g*2); S.adCount++; closeModal(); toast("+"+eur(g*2)); }); return; }
  earn(g); closeModal(); toast("+"+eur(g));
};

/* ============ DÉMARRAGE ============ */
load();
renderNav(); renderTab(true); renderPomoUI(); header(); scheduleBuzz();
offline();
requestAnimationFrame(t=>{prev=t;frame(t)});
</script>
</body>
</html>
